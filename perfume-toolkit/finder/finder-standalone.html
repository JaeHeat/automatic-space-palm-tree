  .chip{background:var(--card);border:1px solid var(--line);color:var(--muted);

  .chip:hover{border-color:var(--gold);color:var(--text)}

  .result-head{margin:26px 0 4px;font-size:14px;color:var(--muted)}

  .note{font-size:11px;color:var(--gold2);border:1px solid var(--line);border-radius:999px;padding:2px 9px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;
       display:flex;flex-direction:column;transition:.15s}
  .card:hover{border-color:var(--gold);transform:translateY(-2px)}
  .card .img{aspect-ratio:1;background:#fff center/cover no-repeat;}
  .card .body{padding:12px 13px 14px;display:flex;flex-direction:column;gap:6px;flex:1}
  .card .bk{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--gold2)}
  .card .tt{font-size:14px;font-weight:600;line-height:1.3;flex:1}
  .card .pr{display:flex;align-items:baseline;gap:8px}
  .card .price{font-size:17px;font-weight:700}
  .card .vs{font-size:12px;color:var(--muted);text-decoration:line-through}
  .card .cta{margin-top:4px;text-align:center;background:var(--gold);color:#1a1206;
       font-weight:700;font-size:13px;padding:9px;border-radius:9px}
  .conf{display:inline-block;font-size:10px;text-transform:uppercase;letter-spacing:.08em;
       padding:2px 7px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
  .conf.high{color:var(--green);border-color:#28432f}
  .empty{color:var(--muted);padding:30px 0;text-align:center}
  .foot{margin-top:40px;color:var(--muted);font-size:12px;text-align:center;line-height:1.7}
  .disclaimer{font-size:11px;color:#6f6450;margin-top:6px}
</style>

"products": [{"title": "French Avenue Veneno Bianco Unisex Eau de Parfum 100ml", "brand": "French Avenue", "price": 64.95, "url": "https://felofraganciasshop.com/products/french-avenue-veneno-bianco-unisex-eau-de-parfum-100ml", "image": "https://cdn.shopify.com/s/files/1/0701/6339/8847/files/French-Avenue-Veneno-Bianco-Unisex.jpg?v=1776712654", "gender": "unisex"}]}]};</script>

<body>
<div class="wrap">
  <header>
    <div class="brand">Felo Fragancias</div>
    <div class="lang">
      <button id="en" class="on" onclick="setLang('en')">EN</button>
      <button id="es" onclick="setLang('es')">ES</button>
    </div>
  </header>

  <h1 data-i18n="title"></h1>
  <p class="sub" data-i18n="sub"></p>

  <div class="searchbox">
    <input id="q" type="text" autocomplete="off" />
  </div>

  <div class="chiplabel" data-i18n="popular"></div>
  <div class="chips" id="chips"></div>

  <div id="out"></div>

  <div class="foot">
    <div data-i18n="footnote"></div>
    <div class="disclaimer" data-i18n="legal"></div>
  </div>
</div>

<script>
// Where the JSON data lives. When embedding elsewhere, point this at the
// folder that serves catalog.json / designers.json / dupes.json.
const DATA_BASE = new URLSearchParams(location.search).get("data") || "../data";

const I18N = {
  en:{title:'Love a designer perfume? <span class="accent">Find the one that smells like it.</span>',
      sub:"Type a fragrance you love — we'll show you the bottle on our shelves that smells just like it, for a fraction of the price.",
      placeholder:"e.g. Baccarat Rouge 540, Sauvage, Aventus…",
      popular:"Popular searches", smells:"Smells like", saves:"You save",
      from:"from", vs:"retail", shop:"Shop this", inspired:"Inspired by",
      none:"We don't have a curated match for that one yet — try one of the popular searches above, or message us and we'll recommend something.",
      footnote:"Found at felofraganciasshop.com · Free shipping over $75 · Miami, FL",
      legal:"All products are genuine, branded fragrances. Designer names are used only to describe similar scent profiles; we are not affiliated with the designer brands.",
      conf:{high:"Spot-on match",medium:"Close match"}},
  es:{title:'¿Te encanta un perfume de diseñador? <span class="accent">Encuentra el que huele igual.</span>',
      sub:"Escribe un perfume que ames — te mostramos la botella en nuestra tienda que huele igualito, por una fracción del precio.",
      placeholder:"ej. Baccarat Rouge 540, Sauvage, Aventus…",
      popular:"Búsquedas populares", smells:"Huele como", saves:"Ahorras",
      from:"desde", vs:"precio original", shop:"Comprar", inspired:"Inspirado en",
      none:"Aún no tenemos una coincidencia para ese — prueba una de las búsquedas populares de arriba, o escríbenos y te recomendamos algo.",
      footnote:"En felofraganciasshop.com · Envío gratis en compras +$75 · Miami, FL",
      legal:"Todos los productos son fragancias originales de marca. Los nombres de diseñador se usan solo para describir perfiles de aroma similares; no estamos afiliados a esas marcas.",
      conf:{high:"Coincidencia exacta",medium:"Muy parecido"}}
};

let LANG="en", DESIGNERS=[], DUPES={}, CATALOG=[];

function t(k){return I18N[LANG][k]}
function fmt(n){return n==null?"":"$"+Number(n).toFixed(2).replace(/\.00$/,"")}

function setLang(l){
  LANG=l;
  document.getElementById("en").classList.toggle("on",l==="en");
  document.getElementById("es").classList.toggle("on",l==="es");
  document.documentElement.lang=l;
  document.querySelectorAll("[data-i18n]").forEach(e=>e.innerHTML=t(e.dataset.i18n));
  document.getElementById("q").placeholder=t("placeholder");
  renderChips();
  const q=document.getElementById("q").value.trim();
  if(q) search(q); else document.getElementById("out").innerHTML="";
}

function renderChips(){
  const c=document.getElementById("chips"); c.innerHTML="";
  DESIGNERS.slice(0,8).forEach(d=>{
    const el=document.createElement("div"); el.className="chip"; el.textContent=d.designer;
    el.onclick=()=>{document.getElementById("q").value=d.designer; search(d.designer);};
    c.appendChild(el);
  });
}

function norm(s){return (s||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"")}

function search(q){
  const out=document.getElementById("out");
  const nq=norm(q);
  // 1) curated designer match
  let d=DESIGNERS.find(x=>norm(x.designer).includes(nq)||nq.includes(norm(x.designer)));
  if(!d){ // loose token match on designer name
    const tok=nq.split(/\s+/).filter(w=>w.length>2);
    d=DESIGNERS.find(x=>tok.some(w=>norm(x.designer).includes(w)));
  }
  if(d){ renderCurated(d); return; }
  // 2) fallback: match catalog by note keywords
  const hits=catalogByNotes(nq);
  if(hits.length){ renderFallback(q,hits); return; }
  out.innerHTML=`<div class="empty">${t("none")}</div>`;
}

function catalogByNotes(nq){
  const words=nq.split(/\s+/).filter(w=>w.length>2);
  return CATALOG.map(p=>{
    const hay=norm((p.notes||[]).join(" ")+" "+p.desc+" "+p.title);
    let score=0; words.forEach(w=>{if(hay.includes(w))score++});
    return {p,score};
  }).filter(x=>x.score>0).sort((a,b)=>b.score-a.score).slice(0,8).map(x=>x.p);
}

function notesFor(d){return (LANG==="es"?d.notes_es:d.notes_en)||[]}

function renderCurated(d){
  const list=(DUPES[d.slug]||{products:[]}).products;
  const cards=list.map(p=>card({
    brand:p.brand,title:p.title,price:p.price,url:p.url,image:p.image,
    vs:d.price
  })).join("");
  const conf=I18N[LANG].conf[d.confidence]||"";
  document.getElementById("out").innerHTML=`
    <div class="match-banner">
      <span class="orig">${t("smells")}: ${d.designer}</span>
      <span class="fam">· ${d.family}</span>
      <span class="conf ${d.confidence}">${conf}</span>
      ${d.savings?`<span class="save">${t("saves")} ~${fmt(d.savings)}</span>`:""}
      <div class="notes">${notesFor(d).map(n=>`<span class="note">${n}</span>`).join("")}</div>
    </div>
    <div class="grid">${cards}</div>`;
}

function renderFallback(q,hits){
  const cards=hits.map(p=>card({brand:p.brand,title:p.title,price:p.price,url:p.url,image:p.image})).join("");
  document.getElementById("out").innerHTML=`
    <div class="result-head">${t("smells")} “${q}”:</div>
    <div class="grid">${cards}</div>`;
}

function card(o){
  return `<a class="card" href="${o.url}" target="_blank" rel="noopener">
    <div class="img" style="background-image:url('${o.image||""}')"></div>
    <div class="body">
      <div class="bk">${o.brand||""}</div>
      <div class="tt">${o.title}</div>
      <div class="pr">
        <span class="price">${fmt(o.price)}</span>
        ${o.vs?`<span class="vs">${fmt(o.vs)} ${t("vs")}</span>`:""}
      </div>
      <div class="cta">${t("shop")}</div>
    </div></a>`;
}

async function load(){
  if(window.EMBEDDED_DATA){           // standalone single-file build
    DESIGNERS=window.EMBEDDED_DATA.designers;
    CATALOG=window.EMBEDDED_DATA.catalog;
    DUPES=Object.fromEntries(window.EMBEDDED_DATA.dupes.map(d=>[d.slug,d]));
  }else{
    const j=async f=>fetch(`${DATA_BASE}/${f}`).then(r=>r.json());
    [DESIGNERS,CATALOG,DUPES]=await Promise.all([
      j("designers.json"), j("catalog.json"),
      j("dupes.json").then(a=>Object.fromEntries(a.map(d=>[d.slug,d])))
    ]);
  }
  setLang("en");
  document.getElementById("q").addEventListener("input",e=>{
    const v=e.target.value.trim();
    if(v.length>=2) search(v); else document.getElementById("out").innerHTML="";
  });
}
load();
</script>
</body>
</html>
